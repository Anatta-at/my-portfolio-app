# ✅ แก้ไข: ลบ 'version: 3.8' ออก
# ก่อน: version: '3.8' ถูก Deprecated ใน Docker Compose v2+ และผลิต warning
# หลัง: ไม่ต้องระบุ version ใน Docker Compose v2

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/login
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/register
    env_file:
      - .env
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      # ✅ แก้ไข: เปลี่ยน POSTGRES_PASSWORD จาก hardcoded มาใช้ env var
      # ก่อน: POSTGRES_PASSWORD=Heyrose05 ถูก hardcode ในไฟล์และปรากฏบน GitHub
      # หลัง: อ่านจาก .env file ด้วย ${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-intelliport_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
